name: Search Interest Snapshot reliability
on:
  push:
    branches:
      - fix/search-interest-marketing-nov7
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actors/search-interest-snapshot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: actors/search-interest-snapshot/package-lock.json
      - run: npm ci
      - run: node --check src/main.js
      - run: node -e "JSON.parse(require('node:fs').readFileSync('.actor/input_schema.json','utf8'))"
      - run: npm test
