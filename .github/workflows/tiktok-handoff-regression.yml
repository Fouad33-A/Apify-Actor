name: TikTok handoff regression
on:
  workflow_dispatch:
  push:
    branches: [fix/tiktok-creator-search-nov3]
    paths:
      - 'actors/tiktok-creator-search/scripts/prepare-comments-input.mjs'
      - 'actors/tiktok-creator-search/scripts/test-handoff.mjs'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tiktok-creator-search-nov3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node actors/tiktok-creator-search/scripts/test-handoff.mjs
      - run: node actors/tiktok-comments-scraper/test-repeated-questions.mjs
      - run: node actors/tiktok-comments-scraper/test-creator-handoff.mjs
      - run: node --check actors/tiktok-comments-scraper/main.js
      - run: node actors/tiktok-comments-scraper/test-question-clusters.mjs
