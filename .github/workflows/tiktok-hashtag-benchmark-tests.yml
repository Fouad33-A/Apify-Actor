name: TikTok Hashtag Benchmark Tests
on:
  push:
    branches:
      - fix/tiktok-hashtag-benchmark-nov7
    paths:
      - 'actors/tiktok-hashtag-benchmark/**'
      - '.github/workflows/tiktok-hashtag-benchmark-tests.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actors/tiktok-hashtag-benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: actors/tiktok-hashtag-benchmark/package-lock.json
      - run: npm ci
      - run: npm test
