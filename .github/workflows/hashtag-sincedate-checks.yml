name: Hashtag Since Date Checks
on:
  push:
    branches: [fix/hashtag-sincedate-safe-nov7]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and schema
        working-directory: actors/tiktok-hashtag-benchmark
        run: |
          node --check src/main.js
          node -e "const s=require('./.actor/input_schema.json');if(s.properties.sinceDate.type!=='string')process.exit(1)"
      - name: Full regression tests
        working-directory: actors/tiktok-hashtag-benchmark
        run: |
          npm ci --no-audit --no-fund
          npm test
