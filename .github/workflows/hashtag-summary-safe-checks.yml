name: Hashtag Summary Safe Checks
on:
  push:
    branches: [fix/hashtag-summary-safe-nov7]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        working-directory: actors/tiktok-hashtag-benchmark
        run: node --check src/main.js
      - name: Run existing regression tests
        working-directory: actors/tiktok-hashtag-benchmark
        run: |
          npm ci --no-audit --no-fund
          npm test
