name: Free Creative Center diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: fix/tiktok-creator-search-nov3
      - name: Check public HTML (no Apify)
        run: node actors/tiktok-creator-search/scripts/check-creative-center.mjs
      - name: Upload JSON diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-center-public-html
          path: diagnostics/creative-center.json
          if-no-files-found: warn
          retention-days: 7
